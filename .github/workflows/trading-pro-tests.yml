name: Trading PRO — simulação e risco

on:
  push:
    branches: [feature/trading-pro-paper-v1, feature/trading-pro-historical-validation-v2, feature/trading-pro-scheduled-paper-v3, feature/trading-pro-observability-v4]
  pull_request:
    paths:
      - "trading_pro.py"
      - "trading_backtest.py"
      - "trading_scheduler.py"
      - "trading_observability.py"
      - ".github/workflows/trading-pro-schedule.yml"
      - "tests/test_trading_pro.py"
      - "tests/test_trading_backtest.py"
      - "tests/test_trading_scheduler.py"
      - "tests/test_trading_observability.py"
      - "templates/trading_pro.html"
      - "templates/trading_monitor.html"
      - "templates/trading_backtest.html"
      - "app.py"
      - ".github/workflows/trading-pro-tests.yml"

permissions:
  contents: read

jobs:
  trading-pro-tests:
    name: Testar robôs simulados e proteção de risco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependências mínimas do motor
        run: python -m pip install Flask==3.0.3 requests==2.32.3 python-dotenv==1.0.1
      - name: Verificação de sintaxe
        run: python -m py_compile trading_pro.py trading_backtest.py trading_scheduler.py trading_observability.py app.py
      - name: Testes offline — nenhum dinheiro real
        run: python -m unittest discover -s tests -p "test_trading*.py" -v
      - name: Smoke test — importar Flask e servir dashboard autenticado
        env:
          DATABASE_PATH: ${{ runner.temp }}/trading-smoke.db
          STORAGE_DIR: ${{ runner.temp }}/tp-storage
          EXPORT_DIR: ${{ runner.temp }}/tp-exports
          SECRET_KEY: testing-ci-only
        run: |
          python - <<'PY'
          import app
          assert "trading_pro_page" in app.app.view_functions
          assert "trading_backtest_page" in app.app.view_functions
          assert "tp_auto_status" in app.app.view_functions
          assert "tp_scheduled_cron" in app.app.view_functions
          assert "tp_monitor_page" in app.app.view_functions
          assert "tp_monitor_check_market" in app.app.view_functions
          with app.app.test_client() as client:
              with client.session_transaction() as session:
                  session["user_id"] = 987
                  session["user_email"] = "ci@example.test"
              page = client.get("/trading-pro")
              assert page.status_code == 200, page.status_code
              assert b"PAPER TRADING" in page.data
              backtest_page = client.get("/trading-pro/backtest")
              assert backtest_page.status_code == 200
              assert b"Backtesting" in backtest_page.data
              monitor_page = client.get("/trading-pro/monitor")
              assert monitor_page.status_code == 200
              monitor_api = client.get("/trading-pro/api/monitor")
              assert monitor_api.status_code == 200
              assert monitor_api.json["monitor"]["execution_mode"] == "PAPER_ONLY"
              scheduler = client.get("/trading-pro/api/automation/status")
              assert scheduler.status_code == 200
              assert scheduler.json["automation"]["paper_only"] is True
              api = client.get("/trading-pro/api/status")
              assert api.status_code == 200, api.status_code
              assert api.json["state"]["execution_mode"] == "PAPER_ONLY"
          print("Flask smoke test OK")
          PY
