name: Trading PRO — simulação e risco

on:
  push:
    branches: [feature/trading-pro-paper-v1]
  pull_request:
    paths:
      - "trading_pro.py"
      - "tests/test_trading_pro.py"
      - "templates/trading_pro.html"
      - "app.py"
      - ".github/workflows/trading-pro-tests.yml"

permissions:
  contents: read

jobs:
  trading-pro-tests:
    name: Testar robôs simulados e proteção de risco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependências mínimas do motor
        run: python -m pip install Flask==3.0.3 requests==2.32.3
      - name: Verificação de sintaxe
        run: python -m py_compile trading_pro.py app.py
      - name: Testes offline — nenhum dinheiro real
        run: python -m unittest discover -s tests -p "test_trading_pro.py" -v
