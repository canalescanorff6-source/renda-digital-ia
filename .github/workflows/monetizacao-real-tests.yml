name: Monetizacao Real — testes
on:
  pull_request:
    paths:
      - "monetizacao_real.py"
      - "templates/monetizacao_real.html"
      - "templates/base.html"
      - "templates/dashboard.html"
      - "app.py"
      - "tests/test_monetizacao_real.py"
      - ".github/workflows/monetizacao-real-tests.yml"
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install Flask==3.0.3
      - name: Python syntax check
        run: python -m py_compile monetizacao_real.py app.py
      - name: Route, access control and revenue tracker tests
        run: python -m unittest discover -s tests -p 'test_monetizacao_real.py' -v
